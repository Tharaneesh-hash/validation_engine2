services:
  - type: web
    name: validation-engine-backend
    env: node
    plan: free
    buildCommand: npm install --prefix backend
    startCommand: node backend/src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGIN
        value: "*"
